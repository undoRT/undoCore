name: Release

on:
  push:
    tags:
      - 'v*'

# Without this the default GITHUB_TOKEN is read only and the release creation
# below fails with a 403.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        draft: false
        prerelease: false